<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1867" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Fond papier -->
  <rect x="0" y="0" width="1400" height="1867" fill="#f7f6f2"/>

  <!-- Bande titre -->
  <text x="700" y="90" text-anchor="middle" font-size="52" font-weight="800" fill="#222" letter-spacing="1">ROSE BLOC 1</text>
  <line x1="0" y1="248" x2="1400" y2="248" stroke="#222" stroke-width="6"/>

  <!-- Grille de reference decorative (comme sur le plan original) -->
  <g stroke="#222" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35">
    <line x1="450" y1="330" x2="450" y2="1650"/>
    <line x1="935" y1="380" x2="935" y2="1650"/>
    <line x1="0" y1="650" x2="1150" y2="650"/>
    <line x1="0" y1="1200" x2="1150" y2="1200"/>
    <line x1="780" y1="1610" x2="780" y2="1867"/>
  </g>

  <!-- Zone musculation -->
  <path d="M0,248 H465 V555 Q465,608 410,608 H0 Z" fill="none" stroke="#222" stroke-width="4"/>
  <text x="30" y="420" font-size="30" font-weight="700" fill="#c1440e" letter-spacing="1">ZONE</text>
  <text x="30" y="470" font-size="30" font-weight="700" fill="#c1440e" letter-spacing="1">MUSCULATION</text>

  <!-- Le Fin Fond -->
  <polygon points="420,248 1140,248 1130,350 1050,400 915,385 520,350"
           fill="#dedcd4" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
  <text x="580" y="330" font-size="24" fill="#0e7c86" letter-spacing="1">LE FIN FOND</text>

  <!-- Bat Cave / Dalle -->
  <polygon points="1140,248 1400,248 1400,1090 1010,1090 1050,950 985,820 1160,680 975,520 1131,351"
           fill="#dedcd4" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="1150,300 1230,270 1200,400 1120,420" fill="#3a4a63"/>
  <text x="1245" y="335" font-size="20" fill="#0e7c86" letter-spacing="1" transform="rotate(70 1245 335)">BAT CAVE</text>
  <text x="1200" y="700" font-size="24" fill="#0e7c86" letter-spacing="1" transform="rotate(90 1200 700)">DALLE</text>

  <!-- La Baleine -->
  <polygon points="855,1085 1030,1085 965,1175 1035,1260 995,1350 1015,1465 1015,1535 825,1535 825,1420 800,1250"
           fill="#dedcd4" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="940,1140 1000,1120 980,1220 920,1230" fill="#3a4a63"/>
  <text x="920" y="1350" font-size="22" fill="#0e7c86" letter-spacing="1" transform="rotate(90 920 1350)">LA BALEINE</text>

  <!-- Titanic + Le 35 / Le Rose / La Proue (mur en anneau, trou central) -->
  <path fill-rule="evenodd" fill="#dedcd4" stroke="#222" stroke-width="6" stroke-linejoin="round"
        d="M700,515 825,570 855,720 800,900 740,1080 685,1160 625,1300 595,1400 580,1450
           545,1400 460,1280 410,1120 330,980 285,850 300,720 350,650 455,600 585,570 Z
           M460,690 650,650 700,780 660,900 615,1050 605,1250 595,1350 585,1400
           560,1350 520,1200 490,1050 455,900 430,780 Z"/>
  <polygon points="455,700 500,790 400,835 385,760" fill="#3a4a63"/>
  <polygon points="660,650 715,705 655,790 615,720" fill="#3a4a63"/>
  <text x="450" y="595" font-size="22" fill="#0e7c86" letter-spacing="1" transform="rotate(-18 450 595)">TITANIC + LE 35</text>
  <text x="700" y="990" font-size="22" fill="#0e7c86" letter-spacing="1" transform="rotate(72 700 990)">LE ROSE</text>
  <text x="400" y="1080" font-size="22" fill="#0e7c86" letter-spacing="1" transform="rotate(-72 400 1080)">LA PROUE</text>

  <!-- Colonne de gauche : Campus Board / Kilter's Homies / Vendetta Wall -->
  <polygon points="0,610 140,650 155,750 120,850 140,950 100,1010 115,1090 180,1100 200,1180 185,1300 120,1440 185,1460 200,1540 180,1610 0,1650"
           fill="#dedcd4" stroke="#222" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="20,900 55,890 50,990 15,995" fill="#3a4a63"/>
  <polygon points="70,1350 105,1340 100,1450 65,1455" fill="#3a4a63"/>
  <text x="8" y="602" font-size="16" font-weight="700" fill="#c1440e" letter-spacing="0.5">CAMPUS BOARD</text>
  <text x="90" y="750" font-size="16" fill="#0e7c86" letter-spacing="0.5" transform="rotate(80 90 750)">KILTER'S HOMIES</text>
  <text x="140" y="1420" font-size="16" fill="#0e7c86" letter-spacing="0.5" transform="rotate(80 140 1420)">VENDETTA WALL</text>

  <!-- Workshop -->
  <path d="M0,1650 H180 V1867 H0 Z" fill="none" stroke="#222" stroke-width="4"/>
  <text x="15" y="1700" font-size="18" fill="#0e7c86" letter-spacing="0.5" transform="rotate(38 15 1700)">WORKSHOP</text>

  <!-- Vestiaires / Accueil -->
  <path d="M40,1650 H740 Q770,1650 770,1680 V1867 H40 Q0,1867 0,1837 V1680 Q0,1650 40,1650 Z"
        fill="none" stroke="#222" stroke-width="4"/>
  <text x="380" y="1790" text-anchor="middle" font-size="26" fill="#333" letter-spacing="1">VESTIAIRES</text>
  <path d="M830,1650 H1400 V1867 H830 Q800,1867 800,1837 V1680 Q800,1650 830,1650 Z"
        fill="none" stroke="#222" stroke-width="4"/>
  <text x="1100" y="1790" text-anchor="middle" font-size="26" fill="#333" letter-spacing="1">ACCUEIL</text>
</svg>
